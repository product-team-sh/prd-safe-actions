<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sequence list</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Production stylesheet, verbatim from my.saleshandy.com; icon font repointed to local files beside it. -->
<link rel="stylesheet" href="prod/index.css">
<link rel="stylesheet" href="kit/kit.css">
<style>
/* page-only rules. Production layout comes from prod/index.css; sl- rules place what is new. */
#sl-root { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#sl-root > .sequence-container { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#sl-root > .sequence-container > .row { flex: 1; min-height: 0; }
/* sequence.tsx wraps the list in Container.sequence-container; the kit shell supplies the page frame */
.sl-bulk-host { display: contents; }
/* proposed: the labelled bar takes the space the icon pair had; it never pushes "Create Sequence" off the row */
#sl-root:not(.sl-today) .sequence-filter-bar-left { flex: 1 1 auto; min-width: 0; }
#sl-root:not(.sl-today) .sl-bulk-host { display: flex; flex: 1 1 auto; min-width: 0; margin-left: -5px; }
#sl-root:not(.sl-today) .sequence-filter-bar > .row { flex-shrink: 0; margin-left: 20px; }
/* selection banner (A): production's yellow ui/Alert, kit copy inside */
.sequence-list .shd-alert.alert-width { width: 100%; align-items: center; }
.sequence-list .shd-alert .shd-alert--icon { display: flex; color: #b45309; }
.sequence-list .shd-alert .shd-alert--text { flex: 1; }
.sequence-selection-info--wrapper .nx-banner-row { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 12px; }
.sequence-selection-info--wrapper .nx-banner-text { font-size: 12px; line-height: 22px; font-weight: 400; color: #1f2937; }
.sequence-selection-info--wrapper .nx-banner-link { font-size: 12px; line-height: 22px; }
/* F dialog: sequences named above the breakdown; the kept subsequence checkbox */
.sl-names { font-size: 14px; line-height: 20px; color: #1f2937; overflow-wrap: anywhere; }
.nx-extra .bs-checkbox-wrapper { display: inline-flex; align-items: center; gap: 8px; margin: 0; cursor: pointer; }
.nx-extra .checkbox-label-text { font-size: 14px; line-height: 20px; color: #1f2937; }
/* the switch must not flip before the dialog confirms */
.sequence-switch input { pointer-events: none; }
@media (max-width: 600px) {
  .sequence-container .sequence-components .sequence-list-container .sequence-filter-bar { flex-wrap: wrap; row-gap: 12px; padding: 16px; }
  .sequence-container .sequence-components .sequence-list-container .sequence-filter-bar .sequence-filter-bar-left { flex-wrap: wrap; row-gap: 12px; width: 100%; }
  .sequence-container .sequence-components .sequence-list-container .sequence-list { padding: 0 16px; }
  .page-header { padding-left: 16px !important; padding-right: 16px !important; }
  #sl-root .sequence-filter-bar > .row { margin: 0 !important; }
  .sequence-container .sequence-components .sequence-list-container .sequence-filter-bar > .row > .col-md-12 { padding: 0; }
  .sequence-selection-info--wrapper .nx-banner-row { flex-direction: column; gap: 4px; }
  .sequence-selection-info--wrapper .nx-banner-row .sequence-selection-info--separator { display: none; }
}
</style>
</head>
<body>
<script src="kit/kit.js"></script>
<script src="sequence-list-markup.js"></script>
<script src="sequence-list.js"></script>
</body>
</html>
