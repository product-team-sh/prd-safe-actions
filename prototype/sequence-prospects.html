<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sequence prospects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Production stylesheet, verbatim from my.saleshandy.com; icon font repointed to local files beside it. -->
<link rel="stylesheet" href="prod/index.css">
<link rel="stylesheet" href="kit/kit.css?v=20261120">
<style>
/* page-only rules. Production layout comes from prod/index.css; nx- rules cover what is new. */
#sp-root { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#sp-root > .sequence-container { flex: 1; min-height: 0; }
/* the demo bar takes 44px of height; keep production's fixed rows from being squeezed by the flex column */
.contact-list-container > .sequence-prospect-actions, .contact-list-container > .status-filter, .contact-list-container > .prospect-banner { flex-shrink: 0; }
.prospects-main { min-height: 0; }
.sp-bulk-today { display: contents; }
/* production is desktop-first; at phone width the search takes its own line so the bulk bar keeps Remove in view */
@media (max-width: 600px) {
  .sequence-container .sequence-components .contact-list-container .sequence-prospect-actions { height: auto; padding: 12px 16px; }
  .sequence-container .sequence-components .contact-list-container .sequence-prospect-actions .sequence-prospect-search-bar-and-filter { width: 100%; flex-wrap: wrap; row-gap: 12px; }
  .sequence-prospect-search-bar-and-filter > form { flex-basis: 100%; }
  .sequence-prospect-search-bar-and-filter > form .search-input { width: 100%; }
  .sequence-prospect-right-actions { display: none !important; }
  .sequence-container .sequence-components .contact-list-container .status-filter { overflow-x: auto; padding-left: 16px; padding-right: 16px; }
  .sequence-container .sequence-components .single-sequence-tab-container .bs-tabs .bs-tabs-nav { padding: 0 16px; overflow-x: auto; }
  .page-header { padding-left: 16px !important; padding-right: 16px !important; }
}
/* icon-only bulk bar: production's ghost icon buttons, same .8rem gap as the Today bar */
.sp-bar { display: flex; align-items: center; gap: .8rem; min-width: 0; }
.sp-bar .sp-div { margin: 0; flex-shrink: 0; }
.sp-bar .bulk-action-icon-button.disabled { pointer-events: auto; }
.sp-bar .bulk-action-icon-button:focus-visible { outline: 2px solid #1d4ed8; outline-offset: 1px; }
.sp-bar .bulk-action-icon-button.sp-danger i { color: #b91c1c; }
.sp-bar .bulk-action-icon-button.sp-danger:hover:not(.disabled) { background-color: #fee2e2 !important; }
.sp-bar .bulk-action-icon-button.sp-danger:hover:not(.disabled) i { color: #b91c1c; }
.sp-title-glyph { font-size: 24px; line-height: 24px; width: 24px; height: 24px; flex-shrink: 0; color: #1d4ed8; display: inline-flex; align-items: center; justify-content: center; }
.sp-title-glyph.sp-red { color: #b91c1c; }
.sp-bulk-host { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; }
/* production plays a 0.3s ink-bar slide and row fades; the prototype re-renders on clicks */
.bs-tabs-ink-bar { transition: none !important; }
/* pause duration picker, kept from today's PauseProspectModal (its rules are scoped to .pause-prospect-modal) */
.nx-pause { display: flex; flex-direction: column; gap: 12px; }
.nx-pause .form-check { display: flex; align-items: center; padding-left: 0; margin: 0; cursor: pointer; }
.nx-pause .form-check-input { position: static; margin: 0; width: 16px; height: 16px; accent-color: #1d4ed8; flex-shrink: 0; }
.nx-pause .form-check-label { display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; color: #1f2937; margin-left: 8px; cursor: pointer; }
.nx-pause .bs-input-number-container { display: inline-block; width: 4.125rem; }
.nx-pause .bs-input-number { min-width: 0 !important; width: 100% !important; height: 32px; display: flex; align-items: center; }
.nx-pause .bs-input-number-container { flex-shrink: 0; }
.nx-pause .bs-input-number-input { width: 100%; border: 0; outline: 0; padding: 0 8px; font: 14px/20px Inter, sans-serif; color: #1f2937; background: transparent; }
.nx-pause .nx-field-err { margin: 0; font-size: 12px; line-height: 16px; color: #b91c1c; }
/* popup direction D (approved 19 Nov 2026): 32rem card, no header or footer rule, grey note row for can't-undo (Remove, Unsubscribe, Mark as finished) */
.confirmation-modal-v3.nx-dD .modal-dialog { width: 32rem !important; max-width: calc(100vw - 32px); }
.nx-dD .modal-header { border-bottom: 0 !important; padding-bottom: 0 !important; }
.nx-dD .modal-footer { border-top: 0 !important; }
.nx-dD .nx-impact { gap: 12px; }
.nx-dD .nx-note { font-size: 14px; }
.nx-qnote { display: flex; gap: 8px; align-items: flex-start; padding-top: 12px; border-top: 1px solid #e5e7eb; font-size: 14px; line-height: 20px; color: #4b5563; }
.nx-qnote i { font-size: 16px; width: 16px; height: 16px; line-height: 16px; margin-top: 2px; color: #4b5563; flex-shrink: 0; }
.nx-qnote b { font-weight: 600; color: #1f2937; }
@media (min-width: 601px) {
  .nx-dD .modal-footer .bs-modal-footer-action-buttons { justify-content: flex-end; }
  .nx-dD .modal-footer .bs-modal-footer-action-buttons button { width: auto; min-width: 88px; }
}
</style>
</head>
<body>
<script src="kit/kit.js?v=20261120"></script>
<script src="sequence-prospects-markup.js?v=20261120"></script>
<script src="sequence-prospects.js?v=20261120"></script>
</body>
</html>
