<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Production stylesheet, verbatim from my.saleshandy.com; icon font repointed to local files beside it. -->
<link rel="stylesheet" href="prod/index.css">
<link rel="stylesheet" href="kit/kit.css?v=20261120">
<style>
/* page-only rules. Production layout comes from prod/index.css; lf- rules fit it under the 44px demo bar. */
#lf-root { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#lf-root > .v2-lead-container { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.v2-lead-container .row.lf-row { height: auto; flex: 1; min-height: 0; flex-wrap: nowrap; }
.v2-lead-container .v2-leads-navigation { height: 100%; min-height: 0; flex: 0 0 16.25rem; }
.v2-lead-container .v2-lead-content { height: 100%; min-height: 0; }
.v2-lead-header .bs-tabs-ink-bar { transition: none !important; }
.v2-lead-header .new-badge { font-size: 12px; line-height: 16px; font-weight: 600; color: #1d4ed8; background: #dbeafe; border-radius: 4px; padding: 0 6px; }
.v2-lead-header__action-group .shd-button:disabled { opacity: .35; cursor: not-allowed; }
/* production table scrolls inside OverlayScrollbars; here the wrapper scrolls natively */
.v2-lead-tanstack-table .tanstack-table--wrapper { overflow: auto; }
/* resizer handles show on header hover only (production: @media (hover: hover)); headless reports no hover */
.v2-lead-tanstack-table .column-header-resizer { opacity: 0; }
.v2-lead-tanstack-table .tanstack-table--th:hover > .column-header-resizer { opacity: 1; }
/* production renders the avatar initials via the Avatar atom with a colour per name */
.v2-lead-avatar-placeholder { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; }
.lf-av-0 { background: #dbeafe; color: #1d4ed8; } .lf-av-1 { background: #d1fae5; color: #047857; } .lf-av-2 { background: #fef3c7; color: #b45309; } .lf-av-3 { background: #ede9fe; color: #6d28d9; } .lf-av-4 { background: #fce7f3; color: #be185d; }
.v2-lead-tanstack-table .tanstack-table--td .column-cell-content--value { min-width: 0; }
.v2-lead-email-cell .sh-circle-check { font-size: 16px; }
.lf-pills { gap: 4px; }
/* saved filters popover position is set by script */
.lf-saved-pop { z-index: 1250; width: 18rem; max-width: calc(100vw - 32px); }
.lf-saved-pop .transfer-list { margin: 0; padding: 4px 0; list-style: none; }
.lf-saved-pop .transfer-list li { padding: 6px 16px; cursor: pointer; }
.lf-saved-pop .transfer-list li:hover { background: #f3f4f6; }
.lf-saved-pop .transfer-list li > div { justify-content: space-between; gap: 8px; width: 100%; }
.lf-saved-pop .v2-search-seved-filter { flex: 1; min-width: 0; margin: 0; font-size: 14px; line-height: 20px; color: #1f2937; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lf-saved-pop .transfer-list svg { color: #6b7280; }
.lf-saved-pop .lf-trash, .lf-saved-pop .edit-icon { margin-left: 8px; display: inline-flex; }
.lf-saved-pop .lf-trash:hover svg { color: #b91c1c; }
.lf-saved-pop .transfer-search { padding: 8px 12px 4px; }
/* remove-from-list picker: production's TagAutosuggest2 with checkbox suggestions */
.lf-picker-input { border: 1px solid #d1d5db; border-radius: 4px; padding: 8px 16px; }
.lf-picker-input input { border: 0; outline: 0; width: 100%; font: 14px/20px Inter, sans-serif; }
.lf-suggest { margin-top: 0; max-height: 200px; overflow-y: auto; padding: 12px 0; }
.lf-suggest ul { margin: 0; padding: 0; list-style: none; }
.lf-suggest-row { display: flex; align-items: center; gap: 8px; margin: 0; padding: 6px 0; font-size: 14px; line-height: 20px; color: #1f2937; cursor: pointer; }
.lf-suggest-row .bs-checkbox-wrapper { margin: 0; }
.lf-suggest-meta { margin-left: auto; font-size: 12px; line-height: 16px; color: #6b7280; }
.remove-from-list-modal .modal-body { height: auto !important; max-height: none !important; }
/* add to sequence: production Select atom, shown closed */
.lf-select { display: flex; align-items: center; justify-content: space-between; height: 32px; padding: 0 12px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 14px; line-height: 20px; color: #1f2937; }
.lf-select svg { color: #6b7280; }
.add-to-sequence-reveal-modal__enrichment { margin-top: 16px; }
.add-to-sequence-reveal-modal__credit { margin-right: 16px; }
/* kit gap: setError appends the error after .nx-impact with no gap */
.nx-dialog .confirmation-modal-v3--body > .nx-error { margin-top: 16px; }
/* Email Verifier body */
.lf-more-pill { background: #fff !important; }
.lf-ev-jobs { padding: 16px 24px; display: flex; flex-direction: column; gap: 8px; }
.lf-ev-job { display: flex; justify-content: space-between; padding: 12px 16px; border: 1px solid #e5e7eb; border-radius: 6px; }
@media (max-width: 600px) {
  .v2-lead-container .v2-leads-navigation { display: none; }
  .v2-lead-header { flex-wrap: wrap; padding: 0 16px; }
  .v2-lead-header__actions { overflow-x: auto; max-width: 100%; padding-bottom: 8px; }
  .page-header { padding-left: 16px !important; padding-right: 16px !important; }
  .email-input-and-file-upload-container .email-input-and-file-upload { flex-direction: column; max-height: none; }
  .email-input-and-file-upload-container .email-input-and-file-upload .email-account-input { width: 100%; padding: 16px; }
  .email-input-and-file-upload-container .email-input-and-file-upload .drag-drop-file-container { padding: 16px; }
  .email-verifier-container .pre-select, .email-verifier-container .pre-select-container { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
  .email-verifier-container .pre-select-container { flex-direction: column-reverse !important; align-items: center !important; }
  .email-verifier-container .pre-select-container > * { width: auto !important; max-width: 100%; }
  .email-verifier-container .pre-select-tagline { white-space: normal; }
}
</style>
</head>
<body>
<script src="kit/kit.js?v=20261120"></script>
<script src="lead-finder-markup.js?v=20261120"></script>
<script src="lead-finder.js?v=20261120"></script>
</body>
</html>
